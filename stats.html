<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>إحصائيات المنصة - بصمتك في رحيل الأيام</title>
    <meta property="og:title" content="إحصائيات المنصة">
    <meta property="og:description" content="إحصائيات زوار منصة بصمتك في رحيل الأيام">
    <meta property="og:image" content="https://res.cloudinary.com/ddknditsb/image/upload/c_auto,h_630,w_1200/f_auto/q_auto/dkr72rrmqdb0ixgsohxj.jpg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="stats.css">
</head>

<body>
    
    <header class="stats-header">
        <h1>📊 إحصائيات المنصة</h1>
        <p>بصمتك في رحيل الأيام</p>
    </header>
    
    <div class="stats-container">
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👁️</div>
                <div class="stat-number" id="total-views">0</div>
                <div class="stat-label">إجمالي الزيارات</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">📄</div>
                <div class="stat-number" id="total-pages">0</div>
                <div class="stat-label">عدد المواضيع</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-number" id="top-page" style="font-size: 1.3em;">-</div>
                <div class="stat-label">أكثر موضوع قراءة</div>
            </div>
        </div>
        
        <div class="top-pages-section">
            <h2>📈 أكثر المواضيع قراءة</h2>
            <div id="pages-list">
                <div class="loading">جاري تحميل الإحصائيات</div>
            </div>
        </div>
        
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
        
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="main.js"></script>
    
</body>

</html>
