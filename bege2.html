<head>

  <title>جبريل عليه السلام</title>
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://opal-two-58.vercel.app/images/IMG_2792.jpeg">
  <meta property="og:image" content="https://opal-two-58.vercel.app/images/IMG_2792.jpeg">
  <meta property="og:url" content="https://opal-two-58.vercel.app/bege2.html">
  <meta property="og:title" content="جبريل عليه السلام - الروح الأمين">
  <meta property="og:description" content="تعرف على صفات أمين الوحي جبريل عليه السلام كما وردت في الكتاب والسنة، وعظمة خلق ملك الوحي المقرب الذي يبلغ رسالات الله.">
  
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="data/st.css">

<body>
  <main>
    <div class="card">
      <img src="images/IMG_2792.jpeg" alt="جبريل عليه السلام" class="card-img">
      <h1>أمين الوحي</h1>
      <div id="text-container">جاري جلب الكلام...</div>
      <div class="counter">تمت قراءة هذه الصفحة <span id="view-count">...</span> مرة</div>
    </div>
  </main>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBnU74Im6--bbGVtxasiUxtL5RyK0VtgzY",
      authDomain: "da3wa-tracker.firebaseapp.com",
      databaseURL: "https://da3wa-tracker-default-rtdb.firebaseio.com",
      projectId: "da3wa-tracker",
      storageBucket: "da3wa-tracker.firebasestorage.app",
      messagingSenderId: "481503479391",
      appId: "1:481503479391:web:cb3d14a521f0626337fdea"
    };
    
    // بدء تشغيل Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // تحديث عداد المشاهدات
    const pagePath = 'post_bege2';
    const viewsRef = db.ref('views/' + pagePath);
    
    viewsRef.transaction((currentValue) => {
      return (currentValue || 0) + 1;
    });
    
    // عرض العداد في الصفحة
    viewsRef.on('value', (snapshot) => {
      document.getElementById('view-count').innerText = snapshot.val() || 0;
    });
  </script>
  <script>
    // نطلب من المتصفح جلب ملف النص من مجلد data
    fetch('data/bege2.txt')
      .then(response => response.text()) // تحويل الملف إلى نص
      .then(data => {
        // وضع النص داخل الـ div الذي أنشأته في الخطوة السابقة
        document.getElementById('text-container').innerText = data;
      })
      .catch(error => {
        console.log('هناك خطأ في جلب النص:', error);
      });
  </script>
</body>

</html>
